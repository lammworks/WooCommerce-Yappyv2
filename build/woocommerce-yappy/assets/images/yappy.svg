<?xml version="1.0" encoding="UTF-8"?>
<!--
	Neutral placeholder mark shown next to the payment method at checkout.

	This is NOT the official Yappy logo. Replace this file, or filter
	`wc_yappy_icon`, with the artwork from the Yappy brand kit supplied by
	Banco General. The checkout button itself is rendered by Yappy's own web
	component, so it always carries the official branding.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 32" width="96" height="32" role="img" aria-label="Yappy">
	<rect x="0.5" y="0.5" width="95" height="31" rx="6" fill="#0b3fa8"/>
	<text
		x="48"
		y="21"
		text-anchor="middle"
		font-family="Helvetica, Arial, sans-serif"
		font-size="14"
		font-weight="700"
		fill="#ffffff"
	>Yappy</text>
</svg>
